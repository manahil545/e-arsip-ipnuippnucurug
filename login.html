<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login E-Arsip PR IPNU IPPNU Desa Curug</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .bg-pattern {
            background-color: #f0fdf4;
            background-image: radial-gradient(#10b981 0.5px, transparent 0.5px), radial-gradient(#10b981 0.5px, #f0fdf4 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.1;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 bg-pattern pointer-events-none"></div>
    <div class="absolute -top-24 -right-24 w-64 h-64 bg-emerald-200 rounded-full blur-3xl opacity-50"></div>
    <div class="absolute -bottom-24 -left-24 w-80 h-80 bg-emerald-300 rounded-full blur-3xl opacity-40"></div>

    <!-- Main Container -->
    <div class="w-full max-w-sm z-10">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="flex -space-x-4 mb-4">
                <div class="w-20 h-20 bg-white rounded-3xl p-3 shadow-xl shadow-emerald-900/10 border border-emerald-100 z-10 flex items-center justify-center overflow-hidden">
                    <img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" alt="IPNU" class="w-full h-full object-contain">
                </div>
                <div class="w-20 h-20 bg-white rounded-3xl p-3 shadow-xl shadow-emerald-900/10 border border-emerald-100 flex items-center justify-center overflow-hidden">
                    <img src="https://upload.wikimedia.org/wikipedia/id/5/53/Logo_IPPNU.png" alt="IPPNU" class="w-full h-full object-contain">
                </div>
            </div>
            <h1 class="text-2xl font-black text-emerald-900 tracking-tighter uppercase text-center leading-tight">
                E-Arsip <br> 
                <span class="text-emerald-600 text-sm tracking-widest font-bold">Desa Curug</span>
            </h1>
        </div>

        <!-- Login Card -->
        <div class="glass rounded-[40px] p-8 shadow-2xl shadow-emerald-900/20 border border-white">
            <form action="#" id="loginForm" class="space-y-5">
                <!-- Username -->
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Username</label>
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-emerald-600 group-focus-within:text-emerald-700 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <input 
                            type="text" 
                            id="username"
                            placeholder="Masukkan username"
                            class="w-full bg-white/50 border-2 border-emerald-100 rounded-2xl py-3.5 pl-12 pr-4 outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm font-medium"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Password</label>
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-emerald-600 group-focus-within:text-emerald-700 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input 
                            type="password" 
                            id="password"
                            placeholder="••••••••"
                            class="w-full bg-white/50 border-2 border-emerald-100 rounded-2xl py-3.5 pl-12 pr-4 outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm font-medium"
                            required
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full bg-gradient-to-r from-emerald-800 to-emerald-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg shadow-emerald-200 hover:shadow-emerald-300 active:scale-[0.98] transition-all border-b-4 border-emerald-900/20"
                >
                    Masuk Sekarang
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </form>

            <div id="loading" class="hidden mt-4 text-center text-emerald-600 font-bold text-xs animate-pulse">
                Memproses masuk...
            </div>

            <p class="mt-8 text-center text-[10px] text-emerald-800/40 font-bold uppercase tracking-tighter leading-relaxed">
                Pimpinan Ranting IPNU IPPNU <br> Desa Curug &copy; 2026
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.style.opacity = '0.7';
            loading.classList.remove('hidden');
            
            // Simulasi proses login
            setTimeout(() => {
                alert('Login Berhasil! Mengalihkan ke Dashboard...');
                window.location.reload();
            }, 2000);
        });
    </script>
</body>
</html>
